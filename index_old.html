<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methorics</title>
    <style>
        /* Базовые настройки для центрирования */
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f7; /* Приятный светлый фон вокруг листовки */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Контейнер для листовки с легкой тенью для эффекта бумаги */
        .flyer-container {
            max-width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .flyer-container img {
            display: block;
            max-width: 100%;
            height: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); /* Элегантная тень */
            border-radius: 4px; /* Легкое скругление углов */
        }
    </style>
</head>
<body>

    <div class="flyer-container">
        <img src="IMG_5813.png" alt="Листовка Methorics">
    </div>

</body>
</html>
